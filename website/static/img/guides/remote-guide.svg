<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="手元ガイドと常設ガイドの違いの説明図"><title>手元ガイドと常設ガイドの違いの説明図</title><g font-family="'Yu Gothic','Meiryo',sans-serif"><rect x="0" y="0" width="960" height="380" rx="16" fill="#f1f7f7" /><text x="32" y="43" font-size="27" fill="#183a43" >操作ガイドの見方</text><rect x="28" y="70" width="440" height="268" rx="12" fill="#fff" /><rect x="492" y="70" width="440" height="268" rx="12" fill="#fff" /><text x="52" y="110" font-size="24" fill="#183a43" >手元ガイド</text><text x="516" y="110" font-size="24" fill="#183a43" >常設ガイド</text><rect x="75" y="137" width="347" height="104" rx="12" fill="#15343c" /><text x="100" y="173" font-size="20" fill="#fff" >→ ← →   次の動画</text><text x="100" y="212" font-size="20" fill="#fff" >↑ ↓       一時停止／再開</text><text x="52" y="281" font-size="20" fill="#183a43" >持っている時に開閉</text><text x="52" y="311" font-size="17" fill="#183a43" >VR：スティック下 ／ Desktop：H</text><rect x="542" y="137" width="340" height="104" rx="12" fill="#15343c" /><text x="566" y="173" font-size="20" fill="#fff" >→ ↑       音量を上げる</text><text x="566" y="212" font-size="20" fill="#fff" >↓ ↑       ミュート／解除</text><text x="516" y="281" font-size="20" fill="#183a43" >ワールド内の決まった場所に設置</text><text x="516" y="311" font-size="17" fill="#183a43" >そのワールドの割り当てを確認</text></g></svg>
