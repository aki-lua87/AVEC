<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="リモコンのジェスチャー入力手順の説明図"><title>リモコンのジェスチャー入力手順の説明図</title><g font-family="'Yu Gothic','Meiryo',sans-serif"><rect x="0" y="0" width="960" height="380" rx="16" fill="#f1f7f7" /><text x="32" y="43" font-size="27" fill="#183a43" >ジェスチャー入力：押す → 描く → 離す</text><rect x="28" y="72" width="288" height="268" rx="12" fill="#fff" /><text x="48" y="111" font-size="20" fill="#183a43" >1. 押したまま</text><rect x="336" y="72" width="288" height="268" rx="12" fill="#fff" /><text x="356" y="111" font-size="20" fill="#183a43" >2. 矢印の順に動かす</text><rect x="644" y="72" width="288" height="268" rx="12" fill="#fff" /><text x="664" y="111" font-size="20" fill="#183a43" >3. 操作名を確認して離す</text><rect x="124" y="145" width="75" height="129" rx="28" fill="#183a43" /><rect x="143" y="166" width="37" height="18" rx="6" fill="#69d4c6" /><text x="65" y="309" font-size="17" fill="#183a43" >使用トリガー／使用ボタン</text><text x="365" y="216" font-size="53" fill="#087f8c" >→ ← →</text><text x="360" y="282" font-size="20" fill="#183a43" >例：次の動画</text><rect x="668" y="159" width="230" height="76" rx="12" fill="#e4f5ef" /><text x="699" y="207" font-size="26" fill="#087f8c" >次の動画</text><text x="675" y="283" font-size="20" fill="#183a43" >離した時に実行</text></g></svg>
